<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mam dla Ciebie coś 💐</title>
  <meta name="description" content="Otwórz, kiedy będziesz mieć chwilę tylko dla siebie ❤️">
  <meta name="theme-color" content="#0b0a24">
  <meta name="robots" content="noindex, nofollow">

  <!-- Podgląd linku (Messenger, WhatsApp, iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pl_PL">
  <meta property="og:title" content="Mam dla Ciebie coś 💐">
  <meta property="og:description" content="Otwórz, kiedy będziesz mieć chwilę tylko dla siebie ❤️">
  <!-- Po wdrożeniu podmień na pełny adres, np. https://twoja-strona.vercel.app/og.png -->
  <meta property="og:image" content="og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nocne niebo pełne gwiazd i napis „Mam dla Ciebie coś…”">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mam dla Ciebie coś 💐">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas id="bg" aria-hidden="true"></canvas>

  <section id="intro" class="intro">
    <h1 id="intro-title" class="intro-title">Mam dla Ciebie coś…</h1>
    <button id="open" class="btn-open" type="button">Kliknij 💌</button>
  </section>

  <main id="scene" class="scene">
    <div class="bouquet-wrap">
      <svg id="bouquet" viewBox="0 0 400 520" role="img" aria-label="Bukiet kwiatów"></svg>
    </div>
    <section class="message">
      <p id="msg" class="msg" aria-hidden="true"></p>
      <p id="msg-sr" class="sr-only"></p>
      <p id="sig" class="sig"></p>
      <p id="countdown" class="countdown"></p>
      <p id="hint" class="hint" aria-hidden="true"></p>
    </section>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>
  <button id="mute" class="mute" type="button" aria-label="Wycisz muzykę" hidden>🔊</button>

  <noscript>
    <p class="noscript">Ta niespodzianka potrzebuje włączonego JavaScriptu 💐</p>
  </noscript>
</body>
</html>
